name: Relative strength replay checks
on:
  pull_request:
    paths: ['research/relative-strength-forward/**', '.github/workflows/relative-strength-checks.yml']
  push:
    branches: [main]
    paths: ['research/relative-strength-forward/**', '.github/workflows/relative-strength-checks.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s research/relative-strength-forward -v
