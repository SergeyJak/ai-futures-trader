name: Research data archive
on:
  schedule:
    - cron: '17 3 * * *'
    - cron: '17 15 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/research-archive.yml', 'research/collector-archive/**', 'research/collector-audit/download.py', 'research/dip-regime-forward/**']
  pull_request:
    paths: ['.github/workflows/research-archive.yml', 'research/collector-archive/**', 'research/collector-audit/download.py', 'research/dip-regime-forward/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: research-archive-${{ github.ref }}
  cancel-in-progress: false
jobs:
  archive:
    if: github.event.schedule != '17 15 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s research/collector-archive
      - run: python3 research/collector-audit/download.py --output snapshot
      - run: python3 research/collector-archive/verify.py snapshot
      - name: Package and checksum
        run: |
          tar -czf research-data.tar.gz snapshot
          sha256sum research-data.tar.gz > research-data.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: research-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research-data.tar.gz
            research-data.sha256
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
      - uses: actions/download-artifact@v4
        with:
          name: research-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: restored
      - name: Verify uploaded copy
        run: |
          cd restored
          sha256sum -c research-data.sha256
          tar -xzf research-data.tar.gz
          python3 ../research/collector-archive/verify.py snapshot
  freshness:
    if: github.event.schedule == '17 15 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful archive within 36 hours
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const runs = await github.rest.actions.listWorkflowRuns({owner, repo,
              workflow_id: 'research-archive.yml', branch: 'main', status: 'success', per_page: 100});
            for (const run of runs.data.workflow_runs) {
              if (Date.now() - Date.parse(run.created_at) > 36 * 3600000) continue;
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({owner, repo, run_id: run.id});
              if (artifacts.data.artifacts.some(a => !a.expired && a.name.startsWith('research-data-'))) {
                core.info(`Verified recent archive: ${run.html_url}`);
                return;
              }
            }
            core.setFailed('No successful research archive in 36 hours. Run archive manually before 7-day source retention expires.');

  dip-regime:
    if: github.event.schedule != '17 15 * * *'
    # A research-data blocker must not invalidate a successful archive/freshness run.
    continue-on-error: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s research/dip-regime-forward -p 'test_*.py'
      - run: python3 research/dip-regime-forward/study.py --output dip-regime-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: dip-regime-report
          path: dip-regime-report.json
          retention-days: 90
